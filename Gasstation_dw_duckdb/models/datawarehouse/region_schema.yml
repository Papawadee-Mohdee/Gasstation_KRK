version: 2
seeds:
  - name: station_region_map
    columns:
      - name: station_id
        tests: [unique, not_null]
      - name: region
        tests: [not_null]
models:
  - name: dim_region
    columns:
      - name: region_key
        tests: [unique, not_null]
  - name: dim_station_region
    columns:
      - name: gasstation_key
        tests: [unique, not_null]
      - name: region_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_region')
              field: region_key
